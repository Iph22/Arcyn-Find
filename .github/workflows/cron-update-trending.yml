# GitHub Actions Cron - Update Trending Stats
# Runs every 6 hours to update trending scores and view counts

name: Update Trending Stats (6-hourly)

on:
  schedule:
    # Runs every 6 hours (at 0, 6, 12, 18 hours UTC)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-trending:
    runs-on: ubuntu-latest
    # Needed by the failure alert below; GITHUB_TOKEN is read-only by default.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Trigger Update Trending Endpoint
        run: |
          curl -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.SITE_URL }}/api/cron/update-trending" \
            --fail --silent --show-error
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Log Result
        run: echo "✅ Trending stats updated at $(date)"

      # This workflow failed 40 runs out of 40 between 2026-09-04 and
      # 2026-09-14 and nobody found out until someone read the code. A red X on
      # a schedule-triggered run notifies no one by default.
      #
      # Deliberately dependency-free -- no checkout, no composite action, no
      # third-party step. An alert is only worth having if it survives the
      # failure it is reporting.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "cron failing: ${{ github.workflow }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # One open issue per workflow, commented on rather than duplicated, so
          # an hourly cron that breaks does not open 24 issues a day. Closing the
          # issue is how you acknowledge it; the next failure opens a fresh one.
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$TITLE in:title" --json number,title \
            --jq '[.[] | select(.title == env.TITLE)] | .[0].number // empty' || true)

          body="\`$TITLE\` failed.

          Run: $RUN_URL
          At:  $(date -u +'%Y-%m-%d %H:%M UTC')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi
