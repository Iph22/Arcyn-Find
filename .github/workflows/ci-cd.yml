name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, release ]
  pull_request:
    branches: [ main, develop, release ]
  # Manual redeploy. Once Vercel's Git integration is switched off this
  # workflow is the only deploy path, and a path you cannot trigger without
  # inventing a commit is not one you can rely on in an incident.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # A real gate now, not `continue-on-error: true`.
      #
      # This step used to run `eslint .` with failures ignored, which reported
      # lint coverage the pipeline did not have -- eslint was never installed,
      # so the command exited 127 every time. Installing it does not help:
      # eslint-config-next pulls typescript-eslint, which refuses to load
      # against this project's TypeScript 7. See the PARKED note in
      # eslint.config.mjs and https://github.com/typescript-eslint/typescript-eslint/issues/10940
      #
      # `npm run lint` is oxlint as of bc3034f, which parses TS/TSX natively.
      # Its config errors on the correctness category only and leaves style as
      # warnings, so main sits at zero errors: a non-zero exit here is a real
      # regression rather than a backlog to argue with.
      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Check build artifacts
        run: ls -la .next/

  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript check
        run: npx tsc --noEmit

      # No continue-on-error: these assert that a forged session cookie is
      # rejected. If they fail, the build should not ship.
      - name: Session security checks
        run: npm run test:session

  # No deploy job, and this is deliberate.
  #
  # Vercel's Git integration already builds and deploys this project on every
  # push, and has done so reliably throughout. A second deploy path driven from
  # CI was attempted and does not work: the Vercel CLI authenticates as an
  # account, and the tokens available here are project-scoped. Measured against
  # the live API with two separate tokens:
  #
  #     /v2/user                  404      <- the CLI needs this
  #     /v2/teams                 403      <- and this
  #     /v2/teams/{ourTeam}       403
  #     /v9/projects              200      <- only project endpoints work
  #
  #     $ vercel whoami --token ...
  #     Error: User not found.
  #
  # So `vercel pull` / `deploy` / `promote` cannot run here regardless of flags,
  # and every variation was tried: env vars alone, `--scope <teamId>`, and
  # `vercel pull` first. A project-scoped token is the wrong credential class,
  # not a wrong value.
  #
  # BLUE-GREEN IS BRANCH CONFIGURATION, NOT A TOKEN -- and that is exactly why
  # it needs a guard:
  #
  #     merge to main       -> Vercel builds a PREVIEW deployment (the green)
  #     verify that URL     -> it is a real, complete build of the merge
  #     merge main->release -> Vercel promotes it to production
  #
  # All of it rests on Vercel > Project > Settings > Git > Production Branch
  # being `release`. That setting lives in a dashboard, so nothing in this repo
  # can hold it in place.
  #
  # It was never applied. Until 2026-09-22 this comment read "BLUE-GREEN IS
  # STILL IN PLACE" and docs/DEPLOYMENT.md opened with "Nothing goes straight
  # to production", while the production branch was `main`, the `release`
  # branch did not exist, and merges reached production roughly two minutes
  # later. The claim survived because nothing ever checked it -- a documented
  # control that is not wired up is worse than none, because it stops people
  # being careful. The `production-branch` job below checks it now.
  #
  # The verification this job was going to add lives in `npm run smoke`, and
  # runs against every deployment via deploy-verify.yml.

  # Blue-green's one external dependency, asserted on every run.
  #
  # A project-scoped token cannot reach /v2/user or /v2/teams per the
  # measurements above, but /v9/projects returns 200 -- and reading the git
  # link is all this needs.
  production-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Assert Vercel promotes from `release`
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail

          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN was not available to this run, so the production branch could not be verified."
            exit 1
          fi

          response=$(curl -sS -w $'\n%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          status=${response##*$'\n'}
          body=${response%$'\n'*}

          if [ "$status" != "200" ]; then
            echo "::error::Vercel project read failed (HTTP $status); the production branch could not be verified."
            echo "$body"
            exit 1
          fi

          branch=$(echo "$body" | jq -r '.link.productionBranch // empty')
          [ -n "$branch" ] || branch='(unset, so Vercel uses the repo default branch)'
          echo "Vercel production branch: $branch"

          if [ "$branch" != "release" ]; then
            echo "::error::Production branch is '$branch', expected 'release'. Blue-green is NOT in effect: merges to main publish straight to production with nothing verified first. Set Vercel > Project > Settings > Git > Production Branch to 'release' (see docs/DEPLOYMENT.md)."
            exit 1
          fi

          echo "Blue-green is in effect: production promotes from 'release'."
