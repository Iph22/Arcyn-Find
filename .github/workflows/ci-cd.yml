name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # A real gate now, not `continue-on-error: true`.
      #
      # This step used to run `eslint .` with failures ignored, which reported
      # lint coverage the pipeline did not have -- eslint was never installed,
      # so the command exited 127 every time. Installing it does not help:
      # eslint-config-next pulls typescript-eslint, which refuses to load
      # against this project's TypeScript 7. See the PARKED note in
      # eslint.config.mjs and https://github.com/typescript-eslint/typescript-eslint/issues/10940
      #
      # `npm run lint` is oxlint as of bc3034f, which parses TS/TSX natively.
      # Its config errors on the correctness category only and leaves style as
      # warnings, so main sits at zero errors: a non-zero exit here is a real
      # regression rather than a backlog to argue with.
      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Check build artifacts
        run: ls -la .next/

  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript check
        run: npx tsc --noEmit

      # No continue-on-error: these assert that a forged session cookie is
      # rejected. If they fail, the build should not ship.
      - name: Session security checks
        run: npm run test:session

  deploy:
    needs: [build, type-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Blue-green, in three steps: publish a production build without pointing
      # the domain at it, prove it works, then swap the domain over.
      #
      # This replaces a single `npx vercel --prod` that both built and went live
      # in one motion -- and carried `continue-on-error: true`, so a failed
      # deploy still printed "Deployment completed successfully!". Nothing here
      # is allowed to fail silently; that is the point of the rewrite.
      #
      # The local `npm run build` that used to sit here is gone: `vercel deploy`
      # builds on Vercel, so building twice only bought a second copy of the
      # same failure. The Clerk secrets it passed went with it -- Clerk was
      # replaced by Google OAuth and those two secrets are dead config.

      # CONFIRM ON FIRST RUN: `--skip-domain` (publish without aliasing) and
      # `vercel promote` are the staged-production flow, but availability varies
      # by CLI version and plan. If either is rejected, the run fails loudly
      # here rather than half-deploying -- check `npx vercel deploy --help`.
      #
      # VERCEL_ORG_ID/VERCEL_PROJECT_ID are not optional here. `.vercel/` is
      # gitignored, so a CI checkout carries no project link, and `--yes` would
      # answer the resulting "set up and deploy?" prompt by creating a NEW
      # project named after the checkout directory. The deploy would succeed,
      # the smoke test would pass against that stranger, and `promote` would
      # promote it -- inside the wrong project, leaving the real domain
      # untouched while every step reported green. These two vars are what make
      # the whole job address the intended project.
      #
      # The CLI is pinned: `npx vercel` resolves to whatever is newest at run
      # time, and a flag change in `deploy`/`promote` would land mid-release.
      - name: Deploy green
        id: green
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_ORG_ID"     || { echo "VERCEL_ORG_ID secret is unset"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID secret is unset"; exit 1; }
          url=$(npx --yes vercel@48 deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Green deployment: $url"

      # The gate. These assert that a forged session cookie is rejected AND that
      # a properly signed one is still accepted -- a deployment that fails
      # either never becomes production. SESSION_SECRET must be the value the
      # deployment runs with, or the valid-cookie check fails and this blocks
      # the promote, which is the correct outcome for a secret mismatch.
      - name: Smoke test green
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          BASE_URL: ${{ steps.green.outputs.url }}
        run: npm run test:session:e2e

      # The cutover: an alias swap, not a rebuild. Rolling back is promoting the
      # previous deployment. Note that rollback is not a real option for a
      # release that changes session signing -- going back reinstates cookies
      # the current code cannot verify.
      - name: Promote green to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          npx --yes vercel@48 promote "${{ steps.green.outputs.url }}" --token "$VERCEL_TOKEN"
          echo "Promoted ${{ steps.green.outputs.url }} to production"