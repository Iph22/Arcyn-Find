# GitHub Actions Cron - Free Alternative to Vercel Cron
# Runs daily to fetch new AI tools from all sources

name: Fetch AI Tools (Daily)

on:
  schedule:
    # Runs daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Trigger Fetch Tools Endpoint
        id: fetch
        run: |
          echo "🔄 Triggering fetch-tools endpoint..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 300 \
            --connect-timeout 30 \
            "${{ secrets.SITE_URL }}/api/cron/fetch-tools")
          
          echo "HTTP Status: $HTTP_STATUS"
          echo "http_status=$HTTP_STATUS" >> $GITHUB_OUTPUT
          
          if [ -f response.json ]; then
            echo "Response body:"
            cat response.json | head -c 2000
            echo ""
          fi
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Fetch completed successfully (HTTP $HTTP_STATUS)"
          elif [ "$HTTP_STATUS" -eq 504 ] || [ "$HTTP_STATUS" -eq 408 ]; then
            echo "⚠️ Request timed out (HTTP $HTTP_STATUS) — endpoint may still be processing"
            echo "::warning::Fetch endpoint timed out with HTTP $HTTP_STATUS. The server-side processing may still complete."
          elif [ "$HTTP_STATUS" -eq 401 ]; then
            echo "❌ Authentication failed — check CRON_SECRET matches between GitHub Secrets and Vercel env"
            exit 1
          elif [ "$HTTP_STATUS" -eq 0 ]; then
            echo "❌ Could not connect to ${{ secrets.SITE_URL }} — check SITE_URL secret is set correctly"
            exit 1
          else
            echo "❌ Unexpected HTTP status: $HTTP_STATUS"
            exit 1
          fi
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Log Result
        if: always()
        run: |
          echo "📊 Fetch tools workflow completed at $(date)"
          echo "   HTTP Status: ${{ steps.fetch.outputs.http_status }}"

      # Same failure alert as cron-update-trending.yml; the rationale is there.
      # Note this job treats 504/408 as a warning rather than a failure, so a
      # persistently timing-out endpoint will not alert here. That is the exact
      # shape of the trending outage -- worth revisiting if it recurs.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "cron failing: ${{ github.workflow }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$TITLE in:title" --json number,title \
            --jq '[.[] | select(.title == env.TITLE)] | .[0].number // empty' || true)

          body="\`$TITLE\` failed (HTTP ${{ steps.fetch.outputs.http_status }}).

          Run: $RUN_URL
          At:  $(date -u +'%Y-%m-%d %H:%M UTC')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi
